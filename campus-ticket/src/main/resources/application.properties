spring.application.name=campus-ticket
server.port=8081

# MySQL 数据源
spring.datasource.url=jdbc:mysql://localhost:3306/campus_ticket?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=1234

# 数据库下划线字段映射为 Java 驼峰属性
mybatis.configuration.map-underscore-to-camel-case=true
spring.data.redis.host=192.168.100.128
spring.data.redis.port=6379
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# 如果 Redis 设置了密码，取消下一行注释，在本地填写
spring.data.redis.password=123
logging.level.com.campus.ticket.mapper.ActivityMapper=DEBUG

# 同一用户的报名请求：最近10秒最多放行5次
campus.rate-limit.booking-user.window-seconds=30
campus.rate-limit.booking-user.max-requests=5

# 同一IP：最近10秒最多放行300次报名请求
campus.rate-limit.booking-ip.window-seconds=10
campus.rate-limit.booking-ip.max-requests=300