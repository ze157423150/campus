# Activate only after applying sql/20260924_async_booking.sql and starting Kafka.
campus.booking.enabled=true
# 候补：仅候补邀请需要确认，普通报名仍直接成功。
campus.waitlist.jobs-enabled=true
campus.waitlist.confirm-seconds=300
campus.waitlist.redis-task.retry-seconds=30
campus.waitlist.recovery-delay-ms=3000
campus.waitlist.recovery-initial-delay-ms=5000
campus.waitlist.delay-poll-ms=200
campus.booking.jobs-enabled=true
campus.booking.immediate-dispatch-enabled=true
# Terminal-order Redis recovery is independent of Kafka dispatch.
campus.booking.redis-sync-enabled=true
campus.booking.redis-sync-delay-ms=5000
campus.booking.redis-sync-initial-delay-ms=5000
campus.booking.redis-sync-batch-size=50
campus.booking.redis-sync-retry-seconds=30
campus.booking.order-timeout-seconds=120
campus.booking.topic=campus.registration.v1
campus.booking.dead-letter-topic=campus.registration.v1.dlt
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:192.168.100.128:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=campus-booking-workers-v1
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=20
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
spring.kafka.admin.fail-fast=true
spring.kafka.admin.properties.request.timeout.ms=5000
